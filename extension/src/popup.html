<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --accent:#3f2d24; }
      * { box-sizing: border-box; }
      body { width: 340px; margin: 0; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); }
      header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
      header .brand { font-weight: 700; letter-spacing: .02em; }
      header .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
      #status { padding: 10px 16px; color: var(--muted); font-size: 12px; }
      #list { max-height: 380px; overflow-y: auto; }
      .item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); }
      .item img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; background: #f5f5f4; flex: 0 0 auto; }
      .item .meta { min-width: 0; flex: 1; }
      .item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .item .p { color: var(--muted); font-size: 12px; }
      button { font: inherit; border: 0; border-radius: 8px; padding: 7px 10px; background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
      button:disabled { opacity: .55; cursor: default; }
      footer { padding: 10px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
      a { color: var(--accent); }
      #sync { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
      #sync button { flex: 1; background: #fff; color: var(--ink); border: 1px solid var(--line); }
      #sync .note { padding: 0 16px 8px; color: var(--muted); font-size: 11px; }
      #tabs { display: flex; gap: 6px; padding: 10px 16px 0; }
      #tabs button { flex: 1; background: #fff; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
      #tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">VYA Cross-Lister</div>
      <div class="sub">List your VYA inventory &amp; sync likes</div>
    </header>
    <div id="tabs">
      <button data-platform="depop" class="on">Depop</button>
      <button data-platform="vestiaire">Vestiaire</button>
    </div>
    <div id="status">Loading…</div>
    <div id="list"></div>
    <div class="note" style="padding: 8px 16px 0; color: #78716c; font-size: 11px;">Sync your likes into VYA — opens your shop page and reads the counts.</div>
    <div id="sync">
      <button id="syncDepop">Sync Depop likes</button>
      <button id="syncVestiaire">Sync Vestiaire likes</button>
    </div>
    <footer>Fills photos, caption &amp; price on Depop or Vestiaire in your own session. You confirm the details &amp; publish.</footer>
    <script src="popup.js"></script>
  </body>
</html>
